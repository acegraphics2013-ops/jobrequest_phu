[package]
name = "phu-desktop-chat"
version = "1.0.0"
description = "PHU Workbench Staff Chat Desktop Companion"
authors = ["Health Promotion Unit"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
